name: 部署到生产环境

# ⚠️ 2026-09-19 事故：push main 自动部署已暂时关闭
# ---------------------------------------------------------------------------
# 现象：push main（b21ba39）触发本 workflow 后，服务器执行 /opt/jbksy/deploy.sh
#       的 pnpm install / pnpm build 阶段把小规格 ECS 打到资源耗尽——
#       SSH banner 无响应、Nginx 443 无法反代到 Node 上游，但 Nginx 自身
#       （80 端口 301、443 的 TLS 握手）仍正常，ICMP 0% 丢包。
#       任务在 20 分钟 timeout 后被取消，服务器进入不可用状态。
# 处理：在部署方案改造完成前，关闭 push 自动触发，只保留手动触发。
# 改造方向：构建放到 GitHub Actions 完成，服务器只接收 .output 产物并重启，
#          同时补齐磁盘/内存预检、原子切换与健康检查回滚。
# 恢复自动部署前，请先确认服务器已加固并有回滚预案。
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH 部署
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: 触发服务器部署
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              root@${{ secrets.DEPLOY_HOST }} \
              "/opt/jbksy/deploy.sh"

      - name: 部署完成
        if: success()
        run: echo "已部署到 https://jbksy.cn"
